name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # Sproži se le, ko potisnete oznako, ki se začne z 'v' (npr. v1.0.0)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Knjigomatik
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            blaze666/knjigomatik:${{ github.ref_name }}
            blaze666/knjigomatik:latest
