services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: knjigomatik-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knjigomatik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knjigomatik
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knjigomatik
      JWT_SECRET: spremenite-ta-skrivni-kljuc-v-produkciji-2024
#      GEMINI_API_KEY: ********
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: